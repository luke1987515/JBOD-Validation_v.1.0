<h2>Test Plan</h2>

<a href="{% url 'testplan_add' %}">Add Test Plan</a>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Model</th>
        <th>Firmware</th>
    </tr>

    {% for plan in plans %}
    <tr>
        <td>{{ plan.name }}</td>
        <td>{{ plan.model }}</td>
        <td>{{ plan.firmware }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No Data</td>
    </tr>
    {% endfor %}
</table>
