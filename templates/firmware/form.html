{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header">

        <h4>{{ title }}</h4>

    </div>

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-success">

                <i class="fa-solid fa-floppy-disk"></i>

                Save

            </button>

            <a href="{% url 'model_list' %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
