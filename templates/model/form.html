{% extends "base.html" %}

{% block title %}
{{ title }}
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>{{ title }}</h2>

    <a href="{% url 'model_list' %}" class="btn btn-secondary">

        Back

    </a>

</div>

<div class="card">

    <div class="card-body">

        <form method="post">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Model Name

                    </label>

                    {{ form.model_name }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Vendor

                    </label>

                    {{ form.vendor }}

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Platform

                    </label>

                    {{ form.platform }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Status

                    </label>

                    {{ form.status }}

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Firmware

                </label>

                {{ form.firmwares }}

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Description

                </label>

                {{ form.description }}

            </div>

            <button class="btn btn-primary">

                <i class="fa-solid fa-floppy-disk"></i>

                Save

            </button>

            <a href="{% url 'model_list' %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
