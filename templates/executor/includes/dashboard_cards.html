<div class="row mb-4">

    <!-- Running -->
    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card border-success shadow-sm">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h6 class="text-success mb-2">

                            Running Jobs

                        </h6>

                        <h2 class="fw-bold mb-0">

                            {{ running_count }}

                        </h2>

                    </div>

                    <i
                        class="fa-solid fa-play fa-2x text-success">
                    </i>

                </div>

            </div>

        </div>

    </div>

    <!-- Pass -->
    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card border-primary shadow-sm">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h6 class="text-primary mb-2">

                            Passed Jobs

                        </h6>

                        <h2 class="fw-bold mb-0">

                            {{ pass_count }}

                        </h2>

                    </div>

                    <i
                        class="fa-solid fa-circle-check fa-2x text-primary">
                    </i>

                </div>

            </div>

        </div>

    </div>

    <!-- Fail -->
    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card border-danger shadow-sm">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h6 class="text-danger mb-2">

                            Failed Jobs

                        </h6>

                        <h2 class="fw-bold mb-0">

                            {{ fail_count }}

                        </h2>

                    </div>

                    <i
                        class="fa-solid fa-circle-xmark fa-2x text-danger">
                    </i>

                </div>

            </div>

        </div>

    </div>

    <!-- Stop -->
    <div class="col-lg-3 col-md-6 mb-3">

        <div class="card border-dark shadow-sm">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h6 class="text-dark mb-2">

                            Stopped Jobs

                        </h6>

                        <h2 class="fw-bold mb-0">

                            {{ stop_count }}

                        </h2>

                    </div>

                    <i
                        class="fa-solid fa-stop fa-2x text-dark">
                    </i>

                </div>

            </div>

        </div>

    </div>

</div>
